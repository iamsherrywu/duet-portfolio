[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify detects Next.js and installs its maintained OpenNext adapter.
# Do not add an SPA catch-all: API routes and SSR are handled by the adapter.
# APP_URL and all credentials must be configured in the platform environment.
